[tool.poetry]
name = "ai-onboarding-platform-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for AI_Onboarding_Platform"
authors = ["AIBees Academy"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = "0.34.0"}
pydantic = ">=2.7,<3.0"
pydantic-settings = ">=2.10.1"
python-dotenv = "1.1.1"

# LangChain / LangGraph
langchain = "0.3.27"
langgraph = "0.3.34"
langgraph-checkpoint-postgres = "2.0.7"
langchain-google-vertexai = ">=2.0.12"

# Database
sqlalchemy = "2.0.36"
psycopg2-binary = "2.9.10"
psycopg = {extras = ["binary", "pool"], version = "3.2.3"}

# MCP
mcp = ">=1.0.0"

# Observability
langfuse = ">=3.14.1"

# SSE (optional, for streaming)
sse-starlette = "2.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
